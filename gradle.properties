org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft / loader
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.248
neo_version_range=[21.1.219,)
loader_version_range=[4,)

# Mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod metadata
mod_id=createterraform
mod_name=Create: Terraform
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.createterraform
mod_authors=Steal-My-Mods
mod_description=Industrial terraforming for Create. A Terraform Extruder burns Mineral Substrate to print the strata this world would have generated at its own coordinates -- stone, caves and biome-accurate ore veins -- standing still or riding a contraption.

# Dependencies
create_version=6.0.11-300
create_version_range=[6.0.0,7.0)

# Publishing. The project id is a public identifier, not a secret -- the upload token lives in the
# repo's Actions secrets as CURSEFORGE_TOKEN. Only `publishMods` reads any of this; an ordinary
# build ignores it. Blanking this id does not break the build: build.gradle drops the CurseForge
# destination and says so, because an empty id would otherwise fail at upload time, which is the
# worst moment to find out.
curseforge_project_id=1701659
# Modrinth is not a destination (CLAUDE.md, Distribution).
github_repository=Steal-My-Mods/create-terraform
